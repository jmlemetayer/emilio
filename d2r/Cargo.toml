[package]
name = "d2r"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.6"
notify = "8.2.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = ["macros", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing-subscriber = "0.3.23"
